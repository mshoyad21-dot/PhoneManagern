<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoneManagery</title>
<style>
:root{--bg:#F2F4EF;--fg:#14201A;--m:#55665C;--ac:#0E7C47;--ai:#fff;--ln:#D3DBD2;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1411;--fg:#E6EEE8;--m:#93A59A;--ac:#4FD98A;--ai:#0A1A10;--ln:#2A362F;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif}
main{max-width:640px;margin:0 auto;padding:40px 16px 64px;display:flex;flex-direction:column;gap:28px}
h1{font-size:clamp(28px,7vw,40px);line-height:1.2;margin:0}h2{font-size:18px;margin:0 0 8px}p{margin:0}.m{color:var(--m)}
.btn{display:inline-block;background:var(--ac);color:var(--ai);font-weight:700;text-decoration:none;padding:14px 22px;border-radius:6px}
section{border-top:1px solid var(--ln);padding-top:20px}ol{margin:0;padding-left:20px;color:var(--m)}a{color:var(--ac)}
iframe{max-width:100%;border:1px solid var(--ln);border-radius:8px;margin-top:12px}
</style></head><body><main>
<header><h1>PhoneManagery</h1></header>
<div><a class="btn" href="app.apk" download>APK ডাউনলোড করুন</a></div>
<section><h2>ইনস্টল করার নিয়ম</h2><ol><li>APK ডাউনলোড করুন।</li><li>ফাইলটি খুলুন। ফোন অনুমতি চাইলে "এই উৎস থেকে ইনস্টলের অনুমতি" চালু করুন।</li><li>Play Protect সতর্কতা দিলে "তবুও ইনস্টল করুন" বেছে নিন।</li></ol></section>

<section><p class="m">সোর্স কোড: <a href="https://github.com/mshoyad21-dot/PhoneManagern">https://github.com/mshoyad21-dot/PhoneManagern</a></p></section>
</main></body></html>
