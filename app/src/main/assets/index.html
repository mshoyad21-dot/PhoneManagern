<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a1a">
  <title>Galaxy Striker - Space Shooter</title>
  <link rel="icon" type="image/png" href="space_shooter_icon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050510;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at bottom, #101633 0%, #050512 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 500px;
      max-height: 900px;
      box-shadow: 0 0 30px rgba(0, 150, 255, 0.25);
      border-left: 1px solid rgba(0, 200, 255, 0.15);
      border-right: 1px solid rgba(0, 200, 255, 0.15);
      background: #000;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(5, 8, 22, 0.88);
      backdrop-filter: blur(8px);
      z-index: 10;
      padding: 20px;
      text-align: center;
      transition: opacity 0.3s ease;
    }
    .overlay.hidden {
      display: none;
    }
    .logo-img {
      width: 110px;
      height: 110px;
      border-radius: 22px;
      box-shadow: 0 0 25px rgba(0, 220, 255, 0.6);
      margin-bottom: 15px;
      border: 2px solid rgba(0, 220, 255, 0.8);
      object-fit: cover;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(45deg, #00f0ff, #7000ff, #ff007b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
      text-shadow: 0 0 20px rgba(0,240,255,0.4);
    }
    .package-tag {
      font-size: 11px;
      color: #00e5ff;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 3px 12px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-family: monospace;
      letter-spacing: 1px;
    }
    .btn {
      background: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
      color: white;
      border: none;
      padding: 14px 40px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 180, 255, 0.5);
      transition: transform 0.1s, box-shadow 0.2s;
      outline: none;
      margin-top: 15px;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .instructions {
      margin-top: 25px;
      font-size: 13px;
      color: #9ab4d0;
      line-height: 1.6;
      background: rgba(255,255,255,0.05);
      padding: 12px 18px;
      border-radius: 12px;
      max-width: 320px;
    }
    .score-board {
      font-size: 24px;
      color: #ffdf00;
      margin-bottom: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Start Screen -->
    <div id="startScreen" class="overlay">
      <img src="space_shooter_icon.png" alt="Logo" class="logo-img">
      <h1>Galaxy Striker</h1>
      <div class="package-tag">ID: com.galaxystriker.spaceshooter</div>
      <p style="color: #cbd5e1; font-size: 14px; margin-bottom: 10px;">মহাকাশ রক্ষা করুন এলিয়েন আক্রমণ থেকে!</p>
      <button class="btn" id="startBtn">গেম শুরু করুন (PLAY)</button>
      <div class="instructions">
        🕹️ <b>খেলার নিয়ম:</b><br>
        • আঙুল দিয়ে ড্র্যাগ করুন বা Touch/Mouse মুভ করুন।<br>
        • জাহাজ স্বয়ংক্রিয়ভাবে লেজার ফায়ার করবে।<br>
        • শত্রু ধ্বংস করে স্কোর বাড়ান ও পাওয়ার-আপ সংগ্রহ করুন!
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="overlay hidden">
      <h1 style="color: #ff3366;">GAME OVER</h1>
      <div class="score-board" id="finalScore">স্কোর: ০</div>
      <div style="color: #aaa; margin-bottom: 15px;" id="highScoreText">সর্বোচ্চ স্কোর: ০</div>
      <button class="btn" id="restartBtn">আবার খেলুন (RETRY)</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const finalScoreEl = document.getElementById('finalScore');
    const highScoreText = document.getElementById('highScoreText');

    let W = 400;
    let H = 700;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * (window.devicePixelRatio || 1);
      canvas.height = rect.height * (window.devicePixelRatio || 1);
      W = canvas.width;
      H = canvas.height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Audio Synthesizer (No external files needed)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;

    function initAudio() {
      if (!actx) actx = new AudioCtx();
    }

    function playSound(type) {
      if (!actx) return;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain);
      gain.connect(actx.destination);

      const now = actx.currentTime;
      if (type === 'laser') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.12);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'explosion') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(20, now + 0.35);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'powerup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(350, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.25);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    }

    // Game State
    let isPlaying = false;
    let score = 0;
    let highScore = localStorage.getItem('gs_highscore') || 0;
    let lastTime = 0;
    let shootTimer = 0;
    let enemyTimer = 0;
    let stars = [];
    let bullets = [];
    let enemies = [];
    let particles = [];
    let powerUps = [];

    // Player Ship
    const player = {
      x: 0,
      y: 0,
      radius: 24,
      targetX: 0,
      targetY: 0,
      health: 3,
      maxHealth: 3,
      tripleShot: 0
    };

    // Stars background
    for (let i = 0; i < 70; i++) {
      stars.push({
        x: Math.random() * 1000,
        y: Math.random() * 1500,
        size: Math.random() * 2.2 + 0.5,
        speed: Math.random() * 2 + 0.8,
        color: ['#ffffff', '#67e8f9', '#f472b6', '#fef08a'][Math.floor(Math.random() * 4)]
      });
    }

    function initGame() {
      resize();
      player.x = W / 2;
      player.y = H * 0.85;
      player.targetX = player.x;
      player.targetY = player.y;
      player.health = 3;
      player.tripleShot = 0;
      score = 0;
      bullets = [];
      enemies = [];
      particles = [];
      powerUps = [];
      isPlaying = true;
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    // Input handlers (Touch + Mouse)
    let isPointerDown = false;
    function handlePointerMove(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      player.targetX = (clientX - rect.left) * scaleX;
      player.targetY = (clientY - rect.top) * scaleY - 40; // slightly above finger
    }

    canvas.addEventListener('mousedown', (e) => { isPointerDown = true; handlePointerMove(e); });
    window.addEventListener('mousemove', (e) => { if (isPointerDown) handlePointerMove(e); });
    window.addEventListener('mouseup', () => { isPointerDown = false; });

    canvas.addEventListener('touchstart', (e) => { isPointerDown = true; handlePointerMove(e); e.preventDefault(); }, {passive: false});
    canvas.addEventListener('touchmove', (e) => { if (isPointerDown) handlePointerMove(e); e.preventDefault(); }, {passive: false});
    canvas.addEventListener('touchend', () => { isPointerDown = false; });

    startBtn.addEventListener('click', () => { initAudio(); initGame(); });
    restartBtn.addEventListener('click', () => { initAudio(); initGame(); });

    // Spawn Enemy
    function spawnEnemy() {
      const types = [
        { hp: 1, radius: 18, speed: 2.2, color: '#ff0055', scoreVal: 10 },
        { hp: 2, radius: 25, speed: 1.5, color: '#a855f7', scoreVal: 25 },
        { hp: 4, radius: 34, speed: 0.9, color: '#f59e0b', scoreVal: 50 } // Big cruiser
      ];
      const tier = Math.random() < 0.6 ? 0 : (Math.random() < 0.85 ? 1 : 2);
      const conf = types[tier];
      enemies.push({
        x: Math.random() * (W - conf.radius * 2) + conf.radius,
        y: -conf.radius - 10,
        radius: conf.radius,
        hp: conf.hp,
        maxHp: conf.hp,
        speed: conf.speed * (1 + score * 0.0003),
        color: conf.color,
        scoreVal: conf.scoreVal,
        wobble: Math.random() * Math.PI * 2
      });
    }

    function createExplosion(x, y, color, count = 18) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 5 + 1.5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          life: 1.0,
          decay: Math.random() * 0.03 + 0.02,
          color: color || '#ff9900',
          size: Math.random() * 4 + 2
        });
      }
    }

    function drawShip(x, y, size) {
      ctx.save();
      ctx.translate(x, y);

      // Jet Glow
      ctx.beginPath();
      ctx.moveTo(-size * 0.4, size * 0.7);
      ctx.lineTo(0, size * 1.3 + Math.random() * 8);
      ctx.lineTo(size * 0.4, size * 0.7);
      ctx.fillStyle = '#00f0ff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 15;
      ctx.fill();

      // Body
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.lineTo(size * 0.8, size * 0.7);
      ctx.lineTo(size * 0.3, size * 0.5);
      ctx.lineTo(0, size * 0.6);
      ctx.lineTo(-size * 0.3, size * 0.5);
      ctx.lineTo(-size * 0.8, size * 0.7);
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, -size, 0, size);
      grad.addColorStop(0, '#e0f2fe');
      grad.addColorStop(0.5, '#0284c7');
      grad.addColorStop(1, '#0369a1');
      ctx.fillStyle = grad;
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00b4d8';
      ctx.fill();
      ctx.stroke();

      // Cockpit
      ctx.beginPath();
      ctx.ellipse(0, -size * 0.2, size * 0.2, size * 0.4, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#00ffcc';
      ctx.fill();

      ctx.restore();
    }

    function drawEnemy(e) {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.fillStyle = e.color;
      ctx.shadowColor = e.color;
      ctx.shadowBlur = 12;

      // Alien Ship Shape
      ctx.beginPath();
      ctx.moveTo(0, e.radius);
      ctx.lineTo(e.radius, -e.radius * 0.6);
      ctx.lineTo(0, -e.radius * 0.2);
      ctx.lineTo(-e.radius, -e.radius * 0.6);
      ctx.closePath();
      ctx.fill();

      // Enemy Eye/Core
      ctx.beginPath();
      ctx.arc(0, 0, e.radius * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // Health Bar if damaged
      if (e.hp < e.maxHp) {
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fillRect(-e.radius, -e.radius - 8, e.radius * 2, 4);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(-e.radius, -e.radius - 8, (e.radius * 2) * (e.hp / e.maxHp), 4);
      }

      ctx.restore();
    }

    // Main Game Loop
    function gameLoop(time) {
      if (!isPlaying) return;
      const dt = Math.min((time - lastTime) / 1000, 0.1);
      lastTime = time;

      // Smooth ship movement
      player.x += (player.targetX - player.x) * 0.2;
      player.y += (player.targetY - player.y) * 0.2;
      player.x = Math.max(player.radius, Math.min(W - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(H - player.radius, player.y));

      // Shooting
      shootTimer += dt;
      if (shootTimer >= 0.18) {
        shootTimer = 0;
        playSound('laser');
        if (player.tripleShot > 0) {
          player.tripleShot -= dt;
          bullets.push({ x: player.x, y: player.y - player.radius, vx: 0, vy: -12, color: '#38bdf8' });
          bullets.push({ x: player.x - 12, y: player.y - player.radius, vx: -3, vy: -11, color: '#38bdf8' });
          bullets.push({ x: player.x + 12, y: player.y - player.radius, vx: 3, vy: -11, color: '#38bdf8' });
        } else {
          bullets.push({ x: player.x - 8, y: player.y - player.radius, vx: 0, vy: -12, color: '#00f0ff' });
          bullets.push({ x: player.x + 8, y: player.y - player.radius, vx: 0, vy: -12, color: '#00f0ff' });
        }
      }

      // Spawning Enemies
      enemyTimer += dt;
      if (enemyTimer >= Math.max(0.4, 1.2 - score * 0.0008)) {
        enemyTimer = 0;
        spawnEnemy();
      }

      // Clear & Draw BG
      ctx.fillStyle = '#050714';
      ctx.fillRect(0, 0, W, H);

      // Stars
      for (const s of stars) {
        s.y += s.speed;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        ctx.fillStyle = s.color;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 10;
        ctx.fill();

        if (b.y < -10 || b.x < 0 || b.x > W) {
          bullets.splice(i, 1);
        }
      }

      // Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.wobble += 0.04;
        e.y += e.speed;
        e.x += Math.sin(e.wobble) * 1.2;
        drawEnemy(e);

        // Check collision with bullets
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const dist = Math.hypot(e.x - b.x, e.y - b.y);
          if (dist < e.radius + 4) {
            bullets.splice(j, 1);
            e.hp--;
            createExplosion(b.x, b.y, '#00f0ff', 4);
            playSound('hit');

            if (e.hp <= 0) {
              score += e.scoreVal;
              createExplosion(e.x, e.y, e.color, 24);
              playSound('explosion');

              // Chance of Power-up drop
              if (Math.random() < 0.15) {
                powerUps.push({ x: e.x, y: e.y, type: Math.random() < 0.6 ? 'triple' : 'heal' });
              }

              enemies.splice(i, 1);
              break;
            }
          }
        }

        // Check collision with player
        if (enemies[i]) {
          const distToPlayer = Math.hypot(e.x - player.x, e.y - player.y);
          if (distToPlayer < e.radius + player.radius * 0.7) {
            createExplosion(e.x, e.y, '#ff0055', 20);
            enemies.splice(i, 1);
            player.health--;
            playSound('explosion');
            if (player.health <= 0) {
              endGame();
              return;
            }
          } else if (e.y > H + e.radius) {
            enemies.splice(i, 1);
          }
        }
      }

      // Power-ups
      for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];
        p.y += 2.2;
        ctx.save();
        ctx.beginPath();
        ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
        ctx.fillStyle = p.type === 'triple' ? '#38bdf8' : '#22c55e';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.type === 'triple' ? '3X' : '+♥', p.x, p.y);
        ctx.restore();

        // Collect Powerup
        if (Math.hypot(p.x - player.x, p.y - player.y) < player.radius + 14) {
          playSound('powerup');
          if (p.type === 'triple') player.tripleShot += 6;
          if (p.type === 'heal' && player.health < player.maxHealth) player.health++;
          powerUps.splice(i, 1);
        } else if (p.y > H + 20) {
          powerUps.splice(i, 1);
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= pt.decay;
        if (pt.life <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.size * pt.life, 0, Math.PI * 2);
          ctx.fillStyle = pt.color;
          ctx.globalAlpha = pt.life;
          ctx.fill();
          ctx.globalAlpha = 1.0;
        }
      }

      // Draw Player
      drawShip(player.x, player.y, player.radius);

      // HUD
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('SCORE: ' + score, 20, 35);

      // Draw Hearts
      let heartsStr = '';
      for (let i = 0; i < player.health; i++) heartsStr += '❤️ ';
      ctx.textAlign = 'right';
      ctx.font = '16px sans-serif';
      ctx.fillText(heartsStr, W - 20, 35);

      requestAnimationFrame(gameLoop);
    }

    function endGame() {
      isPlaying = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('gs_highscore', highScore);
      }
      finalScoreEl.innerText = 'আপনার স্কোর: ' + score;
      highScoreText.innerText = 'সর্বোচ্চ রেকর্ড: ' + highScore;
      gameOverScreen.classList.remove('hidden');
    }
  </script>
</body>
</html>
